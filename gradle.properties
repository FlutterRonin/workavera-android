# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX is required for Jetpack Compose.
android.useAndroidX=true
# Only keep the R class for the app module itself.
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.configuration-cache=true
# compileSdk 36 is newer than the max version tested with AGP 8.9; suppress the warning.
android.suppressUnsupportedCompileSdk=36
