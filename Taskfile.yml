version: "3"

vars:
  VERSION:
    sh: cat VERSION

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Run unit tests
    cmds:
      - ./gradlew testDebugUnitTest

  lint:
    desc: Run the Android lint checks
    cmds:
      - ./gradlew lintDebug

  build:debug:
    desc: Build the debug APK
    cmds:
      - ./gradlew assembleDebug

  install:
    desc: Install the debug APK on the one attached device
    cmds:
      - ./gradlew installDebug

  build:
    desc: Build the release APK into dist/ as workavera_<version>.apk
    cmds:
      - rm -rf dist && mkdir -p dist
      - ./gradlew assembleRelease
      # Gradle names the file after the build type and whether it is signed;
      # take whichever it produced rather than guessing.
      - |
        apk=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
        if [ -z "$apk" ]; then
          echo "no APK in app/build/outputs/apk/release" >&2
          exit 1
        fi
        cp "$apk" "dist/workavera_{{.VERSION}}.apk"
        case "$apk" in
          *unsigned*)
            echo "WARNING: built unsigned -- app/build.gradle.kts has no release" >&2
            echo "signingConfig, so this APK cannot be installed as-is." >&2
            ;;
        esac
      - |
        cd dist && { command -v sha256sum >/dev/null 2>&1 \
          && sha256sum workavera_*.apk \
          || shasum -a 256 workavera_*.apk; } > SHA256SUMS.txt
      - echo "Release APK generated in dist/ (version {{.VERSION}})"

  clean:
    desc: Remove build outputs
    cmds:
      - ./gradlew clean
      - rm -rf dist
